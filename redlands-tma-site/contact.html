<h1>Contact</h1>
<p class="lede">We accept a very limited number of students.</p>
<p>If you would like to set up an introduction to learn more about our program, send Sensei Walker a message below.</p>
<form class="contact" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
<label>Name<input type="text" name="name" autocomplete="name" required></label>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<label>Phone <span class="opt">(optional)</span><input type="tel" name="phone" autocomplete="tel"></label>
<label>Message<textarea name="message" required placeholder="Tell us a little about yourself and any previous training."></textarea></label>
<input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<input type="hidden" name="_subject" value="New message from the Doshukan website">
<button type="submit">Send message</button>
